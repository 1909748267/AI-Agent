spring:
  application:
    name: ai-agent
  profiles:
    active: local
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
        initialize-schema: true
    mcp:
      client:
        enabled: true
        request-timeout: 60s
        name: mcp-client
        initialized: true
        toolcallback:
          enabled: true
        stdio:
          #指定MCP服务器配置文件路径（推荐）
          servers-configuration: classpath:/mcp-servers-config.json
  #        sse:
  #          connections:
  #            server1:
  #              url: http://localhost:8127






server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.cp.aiagent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug